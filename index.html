<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght
@400;600&display=swap" rel="stylesheet">
    <title> Marching Band </title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-color: #fff8e7;
        color: #800020;
        font-family: 'gill sans', sans-serif;
        text-align: center;
    }

    header {
        background-color: #800020;
        color: #f0c040;
        padding: 40px 20px;
        border-bottom: 6px solid #d4a017;
    }

    h1 {
        font-family: 'gill sans', sans-serif;
        font-weight: 800;   
    }

    main {
        max-width: 500px;
        margin: 40px auto;
        padding: 30px;
        background-color: white;
        border: 2px solid #d4a017;
        border-radius: 12px;
    }

    input[type="text"] {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #800020;
        border-radius: 6px;
    }

    input[type="button"] {
        background-color: #800020;
        color: #f0c040;
        border: none;
        padding: 10px 30px;
        margin-top: 10px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
    }

    input[type="button"]:hover {
        background-color: #a52a2a;
        color: white;
    }

    #result {
        margin-top: 20px;
        font-weight: bold;
        color: #800020;
    }

    .reactor {
        width: 20px;
        height: 20px;
        background-color: #f0c040;
        border-radius: 50%;
        margin: 0 auto 10px;
    }
</style>


</head>
<body>
    <header>
        <div class="reactor"> </div>
        <h1>Marching Band</h1>
        <p> This is the OBLP Marching Band, play instruments and perform!</p>
    </header>

    <main>
        <form>
            <input type="text" id="first_name" placeholder="Enter your first name"><br>
            <input type="text" id="last_name" placeholder="Enter your last name"><br>
            <input type="button" py-click="candidate_checker" value="Enter"><br>
        </form>
        <div id="result"></div>
    </main>

    <py-script src="main.py"></py-script>
</body>
</html>
